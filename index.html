<script>
"use strict";

/* ============================================================================
   CONFIG — все игровые числа проекта.
   Баланс крутится ТОЛЬКО здесь, логику для этого трогать не нужно.
   Источник чисел: GAME_SPEC.md, раздел 5.
   ========================================================================= */
const CONFIG = {
  // Отладка: true рисует тела Matter поверх графики
  debug: false,

  // Логический размер экрана. Ширина подгоняется под окно в fitScreenToWindow():

  // Сейчас обе границы 4:3 — поле всегда 853×640. Чтобы поле снова тянулось за окном,
  // поставить aspectMax: 16 / 9.
  screen: { width: 853, height: 640, aspectMin: 4 / 3, aspectMax: 4 / 3 },

  // Палитра grey box: серым рисуется всё, цвет остаётся только там, где несёт смысл
  colors: {
    bg:        0x33363b,   // тёмно-серый цех
    bed:       0x2f3237,   // полотно между рельсами
    ground:    0x2b2e33,   // пол чуть темнее фона
    cart:      0x7a7f87,   // тележка — плоский серый, без секций

    rail:      0x6b7078,
    sleeper:   0x4a4e54,
    glowBack:  0x3d7ad6,   // холодная подсветка задней рельсы

    text:      '#e8eaed',
    textDim:   '#9aa0a8'
  },

  // Рельсы. yFactor — доля высоты экрана, scale — перспектива (дальняя мельче),
  // color — единственный цвет коробок, который на эту рельсу падает.
  // Обе рельсы стоят вплотную внизу экрана и образуют одно полотно: разнесённые
  // по высоте, они читались как «верхняя и нижняя линии», а не как глубина.
  rails: [
    { key: 'back',  yFactor: 0.68, scale: 0.82, color: 'blue',   glow: 'glowBack',
      depthRail: 2, depthBox: 3, depthCart: 4 },
    { key: 'front', yFactor: 0.84, scale: 1.00, color: 'yellow', glow: 'glowFront',
      depthRail: 8, depthBox: 9, depthCart: 10 }
  ],

  // Тележка. Числа заданы для масштаба 1.0 (передняя рельса) и умножаются на scale рельсы
  cart: {
    width: 200,
    floorThickness: 12,
    wallHeight: 34,
    wallThickness: 12,
    speedBase: 430,        // px/с сразу после нажатия стрелки
    speedMax: 780,         // px/с после полного разгона
    accelTime: 600,        // мс удержания одной стрелки до максимальной скорости
    switchDuration: 150,   // мс на смену рельсы
    swayImpulse: 0.85,      // толчок грузу при рывке влево-вправо, задан для k = 1
    swayMinK: 0.08,        // ниже этого перепада скорости груз не трогаем: разгон идёт
                           // покадрово, и без порога штабель получал полсотни
                           // микротолчков подряд — от них он и разваливался
    swayPower: 2.8,        // кривая рывка: старт с места мягче, разворот злее
    swaySpin: 0.04,        // подкрутка на рывке, идёт по той же кривой
    swayTopFactor: 1.2,    // насколько сильнее сносит верх штабеля: нижние коробки
                           // прижаты весом остальных, верхняя держится одним трением.
                           // Считается на 100 px высоты над полом кузова
    railImpulse: 3.6       // толчок грузу при смене рельсы
  },

  // Коробки: размер -> габарит, ценность, штрафы, доля в спавне.
  // penalty — груз вывалился за борт, missPenalty — коробка упала мимо (ADR-0003)
  boxes: {
    // densityFactor гасит квадратичный рост массы: при одной плотности большая
    // коробка тяжелее малой вчетверо, а итеративный решатель на таком разбросе
    // сходится плохо и выдавливает лёгкие тела из штабеля
    small:  { size: 32, value: 10, penalty: 30,  missPenalty: 5,  weight: 50, densityFactor: 1.5 },
    medium: { size: 48, value: 25, penalty: 80,  missPenalty: 10, weight: 35, densityFactor: 1.1 },

  },

  // Падение и темп (GAME_SPEC.md, раздел 5.3)
  fall: {
    speedStart: 180,      // px/с
    speedMax: 500,
    intervalStart: 1400,  // мс между коробками
    intervalMin: 350,
    rampEvery: 15000,     // мс между ступенями роста
    speedStep: 1.10,      // +10 %
    intervalStep: 0.92    // −8 %
  },

  // Бомбы (GAME_SPEC.md, 5.6). Появляются не сразу: первые полминуты игрок
  // осваивается с потоком коробок
  bombs: {
    size: 40,
    afterMs: 30000,      // с какой секунды забега начинают попадаться
    chance: 0.12,        // доля спавнов, где вместо коробки прилетает бомба
    penalty: 100,        // XP за пойманную бомбу
    // Взрыв радиальный: направление считается от точки взрыва, сила падает с
    // расстоянием и делится на массу коробки. Сколько коробок улетит за борт —
    // решает воздействие, а не константа в конфиге
    blastImpulse: 20,    // px за шаг для средней коробки в эпицентре. Меньше 9 груз
                         // не перелетает борт в 34 px и просто подпрыгивает
    blastRadius: 240,    // px при масштабе 1.0: перекрывает полукузов и штабель.
                         // Дальше радиуса коробка не получает ничего
    blastMin: 0.25,      // множитель силы у самой границы радиуса
    blastUp: 0.7,        // подмешанный вверх вектор: бомба ловится верхней коробкой,
                         // и чистый радиальный разлёт вбивал бы нижний слой в дно
    blastMinUp: 0.35,    // вниз не толкаем никогда: 12 px за шаг пробили бы пол насквозь
    blastSpin: 0.2,      // подкрутка в эпицентре, гаснет вместе с силой
    blastParticles: 5,   // множитель выброса частиц, как у сдачи груза
    shakeMs: 260         // тряска дольше, чем при потере одной коробки (120 мс)
  },

  // Бустер восстановления XP (GAME_SPEC.md, 5.7). Единственный бустер в MVP
  booster: {
    size: 36,
    everyMs: 25000,      // как часто падает
    amount: 150,         // +XP, но не выше стартового максимума
    popupDuration: 1200  // мс жизни всплывающего текста в правом верхнем углу
  },

  // Магазин улучшений (GAME_SPEC.md, 5.8). Валюта — очки, набранные за все забеги.
  // Цены = пропорции спеки × 6. Множитель взят из замера: бот «среднего толкового

  // Максимум уровней — это длина prices, отдельного поля не нужно
  shop: {
    order: ['walls', 'battery', 'suspension'],
    walls: {
      title: 'Высокие борта',
      effect: '+8 px к высоте бортов за уровень',
      prices: [3000, 9000, 24000],
      step: 8
    },
    battery: {
      title: 'Усиленный аккумулятор',
      effect: '+100 к стартовому XP за уровень',
      prices: [4800, 12000, 30000],
      step: 100
    },
    suspension: {
      title: 'Мягкая подвеска',
      effect: '−15 % к импульсу груза при смене рельсы',
      prices: [6000, 18000],
      factor: 0.85
    }
  },

  // XP. Стартовый запас поднят с 500: промах теперь тоже стоит XP (ADR-0003),
  // и часть утечки игрок не может предотвратить в принципе
  xp: { start: 700 },

  // HUD
  hud: {
    xpBarWidth: 240,
    xpBarHeight: 18,
    hintDuration: 10000,   // мс, сколько висит подсказка клавиш (и сколько держится по H)
    flashDuration: 140     // мс, вспышка полосы при потере груза
  },

  // Звук: сэмплы Kenney, CC0 (assets/audio/CREDITS.md)
  audio: {
    volume: 0.6,
    catchCooldown: 60,     // мс между «туками» ловли: пачка коробок иначе даёт кашу
    catchVolume: 0.7,      // звук ловли играет чаще всех, поэтому он тише остальных
    catchStep: 60,         // центов вверх за каждую коробку в кузове
    catchSteps: 8,         // потолок ступеней: выше начинается писк
    catchJitter: 25,       // случайный разброс в центах, чтобы удары не были клонами
    errorCooldown: 120,    // мс между звуками ошибки: взрыв выбрасывает пачку коробок сразу
    blastDetune: -700,     // взрыв бомбы — тот же error.ogg, но сильно ниже и длиннее
    boosterDetune: 400     // подбор бустера — deliver.ogg выше обычного
  },

  // Колонка-тень под падающим объектом: полупрозрачная полоса ровно по ширине
  // коробки, от неё вниз до линии её рельсы. Показывает и точный X посадки,
  // и остаток пути до рельсы
  shadows: {
    width: 0.9,        // доля ширины коробки: колонка чуть уже её самой
    alphaTop: 0.05,    // прозрачность у верхнего края — рядом с коробкой
    alphaBase: 0.26,   // прозрачность у рельсы — в точке посадки
    steps: 12,         // сегментов в колонке: у Graphics нет градиентной заливки
    baseHeight: 6,     // высота уплотнённой «пятки» на рельсе при масштабе 1.0
    maxLength: 0       // потолок длины колонки в px, 0 — без ограничения
  },

  // Частицы при сдаче груза
  particles: {
    perBox: 6,             // сколько частиц на коробку в сдаче
    max: 48,               // потолок, чтобы большая сдача не выбрасывала сотни
    speed: 260,
    lifespan: 700
  },

  // Физика груза
  physics: {
    gravityY: 1,               // спека 5.5 фиксирует 1.0

    // Решатель. Дефолты Matter (6/4) рассчитаны на пару тел: штабель из 8-10
    // разнокалиберных коробок за шесть проходов не сходится, и остаточное
    // проникновение на следующем шаге выдавливает соседа вбок
    positionIterations: 12,
    velocityIterations: 8,

    // Материал коробок. В паре Matter берёт min(friction) и max(frictionStatic,
    // restitution, slop). У тележки friction равен 1 не по нашей воле: Matter
    // принудительно ставит статичному телу friction 1 и restitution 0 —
    // поэтому трение контакта «коробка-дно» задаётся здесь, а не там
    boxFriction: 0.45,
    boxFrictionStatic: 1.0,    // порог срыва покоя: лежащий штабель не трогается
                               // с места от слабого воздействия, но после срыва
                               // трение обычное. Ровно граница «езда / рывок»
    boxFrictionAir: 0.01,
    boxRestitution: 0.02,      // приземлившаяся коробка не подпрыгивает, а садится
    boxDensity: 0.002,         // база; каждый размер домножает своим densityFactor
    contactSlop: 0.3,          // проникновение меньше 0.3 px решатель не правит:
                               // именно эта борьба даёт микродрожь стопки

    // Импульсы в CONFIG заданы для средней коробки; остальные размеры получают
    // своё по массе. setVelocity массу игнорирует, поэтому без этого множителя
    // малая и большая коробки летели бы одинаково — размер бы не читался
    massRefSize: 'medium',
    massInfluence: 0.75,       // 0 — масса не влияет, 1 — честное dv = J / m
    massFactorMin: 0.5,
    massFactorMax: 2.0,

    // Потолок скорости в момент, когда коробка становится грузом. К концу забега
    // она падает втрое быстрее, чем в начале, и вбивает штабель внутрь себя
    catchMaxSpeed: 5.0
  },

  // Границы, за которыми объект считается потерянным.
  // Считаются от рельсы и от тележки, а не от фиксированной линии экрана.
  bounds: {
    missBelowRail: 34,   // насколько ниже своей рельсы коробка засчитана как промах
    cargoDropX: 24,      // запас сверх полуширины кузова, после которого груз за бортом
    cargoDropY: 60       // насколько груз может провалиться ниже пола кузова
  }
};

/* Ширина под пропорции окна: тогда Scale.FIT растягивает канвас ровно на окно
   и тёмных полос по краям не остаётся. Высота логически фиксирована.
   Клампим именно ПРОПОРЦИЮ, а не ширину в пикселях: уже 4:3 поле становится тесным,
   а шире 16:9 тележка перестаёт успевать доехать до коробки на другом краю. */
(function fitScreenToWindow() {
  const s = CONFIG.screen;
  const ratio = (window.innerWidth || 1280) / (window.innerHeight || 720);
  const fit = Math.min(s.aspectMax, Math.max(s.aspectMin, ratio));
  s.width = Math.round(s.height * fit);
})();

/* Категории столкновений Matter.
   Задняя и передняя рельсы физически не пересекаются: жёлтая коробка летит к
   передней рельсе сквозь полосу задней и НЕ должна цеплять тележку, стоящую сзади.
   Отдельная категория для падающих коробок — чтобы они не сталкивались в воздухе. */
const CAT = {
  fall: [0x0002, 0x0008],   // падающие коробки: задняя рельса, передняя
  cart: [0x0004, 0x0010]    // тележка и груз в кузове
};

// Падающая коробка видит только тележку и груз своей рельсы.
// Тележка и груз видят и падающие коробки, и друг друга.
function fallMask(rail) { return CAT.cart[rail]; }
function cartMask(rail) { return CAT.fall[rail] | CAT.cart[rail]; }

/* ============================================================================
   SaveManager — работа с localStorage (рекорд, валюта, апгрейды, громкость)
   ========================================================================= */
const SaveManager = {
  KEY: 'cartRushSave',
  defaults: {
    bestScore: 0,
    currency: 0,
    upgrades: { walls: 0, battery: 0, suspension: 0 },
    volume: 0.6,
    muted: false
  },

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (!raw) return { ...this.defaults };
      return { ...this.defaults, ...JSON.parse(raw) };
    } catch (e) {
      // Повреждённое сохранение не должно ронять игру
      return { ...this.defaults };
    }
  },

  save(data) {
    try {
      localStorage.setItem(this.KEY, JSON.stringify(data));
    } catch (e) {
      // Приватный режим браузера — просто играем без сохранений
    }
  }
};

/* ============================================================================
   Вспомогательное: рисование текстур примитивами.
   Спрайтов в проекте нет — всё генерируется кодом при загрузке.
   ========================================================================= */
function makeBoxTexture(scene, key, sizePx, colorHex) {
  const g = scene.make.graphics({ add: false });

  // Тело коробки — плоская заливка, grey box без градиентов
  g.fillStyle(colorHex, 1);
  g.fillRect(0, 0, sizePx, sizePx);

  // Тёмная окантовка отделяет коробку от соседних в штабеле
  g.lineStyle(2, 0x000000, 0.35);
  g.strokeRect(1, 1, sizePx - 2, sizePx - 2);

  // Полоска-маркировка: по ней видно поворот тела
  g.fillStyle(0xffffff, 0.25);
  g.fillRect(sizePx * 0.18, sizePx * 0.42, sizePx * 0.64, sizePx * 0.16);

  g.generateTexture(key, sizePx, sizePx);
  g.destroy();
}

// Бомба: красный квадрат с чёрным крестом. Спрайтов в проекте нет,
// а «не лови это» должно читаться с одного взгляда
function makeBombTexture(scene, key, sizePx) {
  const g = scene.make.graphics({ add: false });

  g.fillStyle(CONFIG.colors.danger, 1);
  g.fillRect(0, 0, sizePx, sizePx);

  g.lineStyle(2, 0x000000, 0.45);
  g.strokeRect(1, 1, sizePx - 2, sizePx - 2);

  const pad = sizePx * 0.26;
  g.lineStyle(Math.round(sizePx * 0.13), 0x000000, 0.55);
  g.lineBetween(pad, pad, sizePx - pad, sizePx - pad);
  g.lineBetween(sizePx - pad, pad, pad, sizePx - pad);

  g.generateTexture(key, sizePx, sizePx);
  g.destroy();
}

// Бустер: зелёный квадрат с белым плюсом — «поймай, и станет лучше»
function makeBoosterTexture(scene, key, sizePx) {
  const g = scene.make.graphics({ add: false });

  g.fillStyle(CONFIG.colors.booster, 1);
  g.fillRect(0, 0, sizePx, sizePx);

  g.lineStyle(2, 0x000000, 0.35);
  g.strokeRect(1, 1, sizePx - 2, sizePx - 2);

  const arm = sizePx * 0.52;
  const thick = sizePx * 0.16;
  g.fillStyle(0xffffff, 0.9);
  g.fillRect((sizePx - arm) / 2, (sizePx - thick) / 2, arm, thick);
  g.fillRect((sizePx - thick) / 2, (sizePx - arm) / 2, thick, arm);

  g.generateTexture(key, sizePx, sizePx);
  g.destroy();
}

// Квадратик для частиц при сдаче груза — той же природы, что и текстуры коробок
function makeParticleTexture(scene, key, sizePx) {
  const g = scene.make.graphics({ add: false });
  g.fillStyle(0xffffff, 1);
  g.fillRect(0, 0, sizePx, sizePx);
  g.generateTexture(key, sizePx, sizePx);
  g.destroy();
}

// Цвета в CONFIG хранятся числами для Graphics; тексту Phaser нужна строка '#rrggbb'
function hex(color) {
  return '#' + color.toString(16).padStart(6, '0');
}

// Общий стиль текста, чтобы не повторять его в каждой сцене
function textStyle(size, color, bold) {
  return {
    fontFamily: 'Segoe UI, sans-serif',
    fontSize: size + 'px',
    color: color || CONFIG.colors.text,
    fontStyle: bold ? 'bold' : 'normal'
  };
}

/* Список управления. Один источник на меню и паузу: раньше это была строка в 16 px,
   продублированная в трёх местах, и на паузе она не читалась. */
const KEY_HINTS = [
  { keys: ['←', '→'], text: 'ехать вдоль рельсы' },
  { keys: ['↑', '↓'], text: 'сменить рельсу' },
  { keys: ['Пробел'], text: 'сдать груз и получить очки' },
  { keys: ['Esc'], text: 'пауза' },
  { keys: ['M'], text: 'звук вкл / выкл' },
  { keys: ['H'], text: 'показать подсказку в забеге' }
];

/* Кнопка из прямоугольника и текста — отдельных ассетов не нужно.
   Была скопирована в трёх сценах почти дословно; магазин стал бы четвёртой копией.
   opts: { width, height, size, disabled } */
function makeButton(scene, x, y, label, onClick, opts) {
  const o = opts || {};
  const width = o.width || 240;
  const height = o.height || 60;
  const disabled = !!o.disabled;

  const box = scene.add.rectangle(x, y, width, height,
    disabled ? CONFIG.colors.cartDark : CONFIG.colors.boxBlue);
  const text = scene.add.text(x, y, label,
    textStyle(o.size || 26, disabled ? CONFIG.colors.textDim : '#ffffff', true)).setOrigin(0.5);

  // Выключенная кнопка не реагирует вообще: ни курсором, ни подсветкой, ни нажатием
  if (!disabled) {
    box.setInteractive({ useHandCursor: true });
    box.on('pointerover', () => box.setFillStyle(CONFIG.colors.boxYellow));
    box.on('pointerout', () => box.setFillStyle(CONFIG.colors.boxBlue));
    box.on('pointerdown', onClick);
  }

  return { box, text };
}

// Таблица «клавиша → действие»: слева плашки-кейкапы, справа описание.
// Плашки выкладываются справа налево от общей границы, поэтому колонка
// описаний стоит ровно при любом количестве клавиш в строке
function drawKeyHints(scene, centerX, topY) {
  const rowHeight = 34;
  const capHeight = 26;
  const gap = 6;
  const capsRight = centerX - 76;
  const textLeft = centerX - 56;
  const g = scene.add.graphics().setDepth(21);

  KEY_HINTS.forEach((row, index) => {
    const y = topY + index * rowHeight;
    let x = capsRight;

    row.keys.slice().reverse().forEach(key => {
      const label = scene.add.text(0, 0, key, textStyle(14, CONFIG.colors.text, true))
        .setOrigin(0.5).setDepth(22);
      const capWidth = Math.max(28, label.width + 16);

      g.fillStyle(CONFIG.colors.cart, 0.22);
      g.fillRoundedRect(x - capWidth, y - capHeight / 2, capWidth, capHeight, 5);
      g.lineStyle(1, CONFIG.colors.rail, 0.9);
      g.strokeRoundedRect(x - capWidth, y - capHeight / 2, capWidth, capHeight, 5);

      label.setPosition(x - capWidth / 2, y);
      x -= capWidth + gap;
    });

    scene.add.text(textLeft, y, row.text, textStyle(16, CONFIG.colors.textDim))
      .setOrigin(0, 0.5).setDepth(22);
  });
}

// Единая точка воспроизведения звука. Если сэмпла нет в кэше, Phaser бросает
// исключение прямо из обработчика столкновений — оно рвёт цикл
// requestAnimationFrame, и игра замирает целиком на первой же ловле. Так было
// при запуске по file://, где сэмплы не грузятся вовсе (CORS). Проверка кэша
// делает отсутствие звука безобидным: игра идёт молча
function playSfx(scene, key, config) {
  if (!scene.cache.audio.exists(key)) return;
  scene.sound.play(key, config);
}

/* ============================================================================
   BootScene — генерирует текстуры и уходит в меню
   ========================================================================= */
class BootScene extends Phaser.Scene {
  constructor() { super('BootScene'); }

  // Звуки грузятся через fetch, поэтому игра работает только по http://
  // (Live Server), а не двойным кликом по файлу — CORS, см. ADR-0001.
  // По file:// игра теперь не падает, а идёт молча, но об этом надо сказать вслух:
  // молчащая игра без объяснения выглядит как поломка звука
  preload() {
    this.load.on('loaderror', file => console.warn(
      `[Cart Rush] Не загрузился ресурс «${file.key}». Если адрес начинается с file:// — ` +
      'открой index.html через Live Server: по file:// браузер блокирует загрузку звука ' +
      '(CORS). Игра пойдёт без звука.'));

    this.load.audio('catch', 'assets/audio/catch.ogg');
    this.load.audio('deliver', 'assets/audio/deliver.ogg');
    this.load.audio('error', 'assets/audio/error.ogg');
    this.load.audio('gameover', 'assets/audio/gameover.ogg');
  }

  create() {
    // Текстуры коробок: 3 размера × 2 цвета
    for (const [sizeName, spec] of Object.entries(CONFIG.boxes)) {
      makeBoxTexture(this, `box-${sizeName}-yellow`, spec.size, CONFIG.colors.boxYellow);
      makeBoxTexture(this, `box-${sizeName}-blue`, spec.size, CONFIG.colors.boxBlue);
    }
    makeBombTexture(this, 'bomb', CONFIG.bombs.size);
    makeBoosterTexture(this, 'booster', CONFIG.booster.size);
    makeParticleTexture(this, 'particle', 6);

    // Громкость и немой режим переживают перезагрузку
    const save = SaveManager.load();
    this.sound.volume = CONFIG.audio.volume;
    this.sound.mute = save.muted;

    this.scene.start('MenuScene');
  }
}

/* ============================================================================
   GameScene — сам забег
   ========================================================================= */
class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  create() {
    this.cameras.main.setBackgroundColor(CONFIG.colors.bg);

    // Улучшения читаются один раз на забег и складываются в снимок
    this.applyUpgrades();

    // --- состояние забега ---
    this.run = {
      xp: this.upgrades.startXp,
      maxXp: this.upgrades.startXp,
      score: 0,
      elapsed: 0,
      fallSpeed: CONFIG.fall.speedStart,
      spawnInterval: CONFIG.fall.intervalStart,
      lastRamp: 0
    };

    this.fallingBoxes = [];   // коробки в воздухе
    this.cargo = [];          // коробки в кузове
    this.switching = false;
    this.over = false;        // забег окончен, ждём перехода на экран Game Over
    this.xpFlashUntil = 0;    // до какого времени полоса вспыхивает белым
    this.lastCatchSound = 0;
    this.lastErrorSound = 0;
    this.holdTime = 0;        // сколько мс держится текущее направление — из этого разгон
    this.holdDir = 0;
    this.hintTimer = null;    // таймер затухания подсказки, перезапускается по H
    this.hintFade = null;

    // На старте страницы аудиоконтекст ещё заблокирован браузером, и выставленный
    // в BootScene mute мог не примениться. Забег начинается после нажатия клавиши,
    // то есть контекст уже разблокирован — повторяем установку здесь
    this.sound.mute = SaveManager.load().muted;
    this.bestScore = SaveManager.load().bestScore;

    // Положение тележки — источник истины сцены.
    // У составного тела Matter position — это центр масс, а не пол кузова,
    // поэтому графику и границы считаем отсюда, а не из cartBody.position.
    this.cart = {
      x: CONFIG.screen.width / 2,
      y: this.railBedY(1),     // верх пола кузова
      rail: 1,                 // стартуем на передней рельсе
      scale: CONFIG.rails[1].scale,
      vx: 0
    };

    this.drawBackground();
    this.createShadows();
    this.createCart();
    this.createInput();
    this.createHud();

    // Спавн по таймеру; интервал пересоздаётся при росте темпа
    this.spawnTimer = this.time.addEvent({
      delay: this.run.spawnInterval,
      loop: true,
      callback: () => this.spawnNext()
    });

    // Бустер восстановления XP идёт своим ровным ритмом и от темпа не зависит:
    // иначе на разгоне он сыпался бы чаще и обесценивал бы утечку XP
    this.boosterTimer = this.time.addEvent({
      delay: CONFIG.booster.everyMs,
      loop: true,
      callback: () => this.spawnBooster()
    });

    // Ловля: коробка становится грузом при первом касании тележки или груза
    this.matter.world.on('collisionstart', this.onCollisionStart, this);
  }

  /* ---------- купленные улучшения ---------- */

  // Снимок улучшений на этот забег (GAME_SPEC.md, 5.8).
  // CONFIG при этом НЕ трогаем: прибавь мы уровень прямо в CONFIG.cart.wallHeight,
  // борта росли бы с каждым перезапуском забега внутри одной вкладки
  applyUpgrades() {
    const shop = CONFIG.shop;
    const level = SaveManager.load().upgrades;

    this.upgrades = {
      wallHeight: CONFIG.cart.wallHeight + level.walls * shop.walls.step,
      startXp: CONFIG.xp.start + level.battery * shop.battery.step,
      railImpulse: CONFIG.cart.railImpulse *
        Math.pow(shop.suspension.factor, level.suspension)
    };
  }

  /* ---------- геометрия рельс ---------- */

  // Верх пола кузова на рельсе — от него считается всё остальное
  railBedY(index) {
    return Math.round(CONFIG.rails[index].yFactor * CONFIG.screen.height);
  }

  // Линия самой рельсы: колёса тележки стоят ровно на ней
  railLineY(index) {
    return this.railBedY(index) + 30 * CONFIG.rails[index].scale;
  }

  rail() { return CONFIG.rails[this.cart.rail]; }

  /* ---------- фон: полотно, пол цеха и две рельсы ---------- */
  drawBackground() {
    const { width, height } = CONFIG.screen;
    const g = this.add.graphics().setDepth(-9);

    // Полотно между рельсами: без него даже сведённые вплотную рельсы читаются
    // как две отдельные линии, а не как один путь, уходящий вглубь
    const bedTop = this.railLineY(0) - 6;
    const bedBottom = this.railLineY(1) + 20;
    g.fillStyle(CONFIG.colors.bed, 1);
    g.fillRect(0, bedTop, width, bedBottom - bedTop);

    // Пол цеха ниже передней рельсы — отделяет игровое поле от края экрана
    g.fillStyle(CONFIG.colors.ground, 1);
    g.fillRect(0, this.railLineY(1) + 26, width, height);

    CONFIG.rails.forEach((rail, index) => this.drawRail(rail, index));
  }

  // Рельса рисуется своей графикой: у задней всё тоньше, темнее и бледнее —
  // вместе с масштабом тележки это и читается как «сзади / спереди»
  drawRail(rail, index) {
    const width = CONFIG.screen.width;
    const y = this.railLineY(index);
    const s = rail.scale;
    const far = index === 0;               // задняя рельса приглушена
    const glow = CONFIG.colors[rail.glow];
    const g = this.add.graphics().setDepth(rail.depthRail);

    // Мягкое освещение: три полосы цвета рельсы с растущей плотностью.
    // Ближняя рельса заметно ярче дальней — иначе синий, который на тёмно-сером
    // контрастнее жёлтого, вытягивает дальнюю рельсу вперёд и ломает перспективу
    const dim = far ? 0.55 : 1.35;
    const layers = [
      { h: 44 * s, a: 0.05 },
      { h: 26 * s, a: 0.09 },
      { h: 11 * s, a: 0.17 }
    ];
    layers.forEach(layer => {
      g.fillStyle(glow, layer.a * dim);
      g.fillRect(0, y - layer.h / 2 + 3 * s, width, layer.h);
    });

    // Шпалы под рельсой
    const step = 60 * s;
    g.fillStyle(CONFIG.colors.sleeper, far ? 0.5 : 0.8);
    for (let x = 10; x < width; x += step) {
      g.fillRect(x, y + 6 * s, 26 * s, 10 * s);
    }

    // Сама рельса
    g.fillStyle(CONFIG.colors.rail, far ? 0.75 : 1);
    g.fillRect(0, y, width, 6 * s);

    // Тонкий блик цвета рельсы поверх — подсказка «какой цвет сюда падает»
    g.fillStyle(glow, far ? 0.35 : 0.75);
    g.fillRect(0, y, width, 2 * s);
  }

  /* ---------- тени падающих коробок ---------- */

  // По слою на рельсу: тень лежит НА своей рельсе, но ПОД коробками, а у одной
  // Graphics глубина всего одна — двумя рельсами в один слой не уложиться
  createShadows() {
    this.shadowLayers = CONFIG.rails.map(
      rail => this.add.graphics().setDepth(rail.depthRail + 0.5));
  }

  drawShadows() {
    const s = CONFIG.shadows;
    this.shadowLayers.forEach(layer => layer.clear());

    this.fallingBoxes.forEach(box => {
      const railIndex = box.boxData.rail;
      const railY = this.railLineY(railIndex);

      // Колонка начинается у нижней грани коробки и упирается в линию рельсы.
      // Верх обрезается краем экрана: коробка спавнится выше него
      let top = Math.max(0, box.y + box.displayHeight / 2);
      if (s.maxLength > 0) top = Math.max(top, railY - s.maxLength);
      if (top >= railY) return;              // коробка уже на рельсе — колонка не нужна

      const width = box.displayWidth * s.width;
      const x = box.x - width / 2;
      const layer = this.shadowLayers[railIndex];

      // У Graphics нет градиентной заливки, поэтому колонка режется на сегменты
      // с растущей плотностью. Границы округляются: внахлёст два полупрозрачных
      // прямоугольника дали бы тёмную полосу на стыке, а с зазором — светлый шов
      for (let i = 0; i < s.steps; i++) {
        const y0 = Math.round(top + (railY - top) * i / s.steps);
        const y1 = Math.round(top + (railY - top) * (i + 1) / s.steps);
        const t = (i + 1) / s.steps;         // 0 у коробки, 1 у рельсы
        layer.fillStyle(0x000000, s.alphaTop + (s.alphaBase - s.alphaTop) * t);
        layer.fillRect(x, y0, width, y1 - y0);
      }

      // Пятка на самой рельсе: точка посадки читается, даже когда колонка короткая
      const base = s.baseHeight * CONFIG.rails[railIndex].scale;
      layer.fillStyle(0x000000, s.alphaBase);
      layer.fillRect(x, railY - base / 2, width, base);
    });
  }

  /* ---------- тележка ---------- */
  createCart() {
    this.cartGraphics = this.add.graphics();
    this.buildCartBody();
    this.drawCart();
  }

  // Тело пересобирается при смене рельсы: масштаб другой, а Body.scale на
  // статичном составном теле копит погрешность — проще собрать заново
  buildCartBody() {
    if (this.cartBody) this.matter.world.remove(this.cartBody);

    const c = CONFIG.cart;
    const s = this.cart.scale;
    const x = this.cart.x;
    const bedY = this.cart.y;
    const w = c.width * s;
    const ft = c.floorThickness * s;
    const wh = this.upgrades.wallHeight * s;   // высота бортов растёт от улучшения
    const wt = c.wallThickness * s;

    // Дно и два борта. Перегородки в середине нет: кузов единый.
    //
    // Материал задаётся КАЖДОЙ части: столкновения составного тела Matter считает
    // по частям, и свойство на родителе до контакта не доходит. friction здесь не
    // задаём намеренно — Body.setStatic всё равно перезапишет его на 1 (и
    // restitution на 0), а вот frictionStatic и slop он не трогает
    const surface = {
      frictionStatic: CONFIG.physics.boxFrictionStatic,
      slop: CONFIG.physics.contactSlop
    };
    const floor = this.matter.bodies.rectangle(x, bedY + ft / 2, w, ft, surface);
    const leftWall = this.matter.bodies.rectangle(x - w / 2 + wt / 2, bedY - wh / 2, wt, wh, surface);
    const rightWall = this.matter.bodies.rectangle(x + w / 2 - wt / 2, bedY - wh / 2, wt, wh, surface);

    this.cartBody = this.matter.body.create({
      parts: [floor, leftWall, rightWall],
      isStatic: true,
      label: 'cart'
    });

    this.applyFilter(this.cartBody, CAT.cart[this.cart.rail], cartMask(this.cart.rail));
    this.matter.world.add(this.cartBody);
  }

  // Фильтр столкновений нужно проставить каждой части составного тела
  applyFilter(body, category, mask) {
    const parts = body.parts && body.parts.length > 1 ? body.parts : [body];
    parts.forEach(part => {
      part.collisionFilter.category = category;
      part.collisionFilter.mask = mask;
    });
    body.collisionFilter.category = category;
    body.collisionFilter.mask = mask;
  }

  drawCart() {
    const c = CONFIG.cart;
    const s = this.cart.scale;
    const g = this.cartGraphics;
    const x = this.cart.x;
    const bedY = this.cart.y;
    const w = c.width * s;
    const half = w / 2;
    const ft = c.floorThickness * s;
    const wh = this.upgrades.wallHeight * s;   // высота бортов растёт от улучшения
    const wt = c.wallThickness * s;

    g.clear();
    g.setDepth(this.rail().depthCart);

    // Тень: у дальней тележки слабее — это тоже подсказка глубины
    g.fillStyle(0x000000, 0.28 * s);
    g.fillEllipse(x, bedY + ft + 16 * s, w * 0.95, 12 * s);

    // Дно
    g.fillStyle(CONFIG.colors.cart, 1);
    g.fillRect(x - half, bedY, w, ft);

    // Борта — оба серые, деления кузова на секции больше нет
    g.fillStyle(CONFIG.colors.cartDark, 1);
    g.fillRect(x - half, bedY - wh, wt, wh);
    g.fillRect(x + half - wt, bedY - wh, wt, wh);

    // Колёса стоят на линии рельсы
    g.fillStyle(0x24272b, 1);
    g.fillCircle(x - half * 0.55, bedY + ft + 9 * s, 9 * s);
    g.fillCircle(x + half * 0.55, bedY + ft + 9 * s, 9 * s);
  }

  /* ---------- ввод ---------- */
  createInput() {
    const kb = this.input.keyboard;

    // Горизонтальный ход — по удержанию клавиши, опрашивается в update()
    this.keys = kb.addKeys({
      left: Phaser.Input.Keyboard.KeyCodes.LEFT,
      right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      a: Phaser.Input.Keyboard.KeyCodes.A,
      d: Phaser.Input.Keyboard.KeyCodes.D
    });

    // Смена рельсы — разовое событие
    kb.on('keydown-UP', () => this.switchRail(-1));
    kb.on('keydown-W', () => this.switchRail(-1));
    kb.on('keydown-DOWN', () => this.switchRail(1));
    kb.on('keydown-S', () => this.switchRail(1));

    // Сдача груза появится на этапе 2; сейчас пробел просто чистит кузов,
    // чтобы можно было проверить физику накопления
    kb.on('keydown-SPACE', () => this.unloadCargo());

    kb.on('keydown-ESC', () => this.pauseGame());
    kb.on('keydown-P', () => this.pauseGame());

    kb.on('keydown-M', () => this.toggleMute());
    kb.on('keydown-H', () => this.showHint());
  }

  // Отдельного экрана громкости в проекте не будет (anti-scope 16.9),
  // но выключить звук одной клавишей игрок должен мочь.
  //
  // Источник истины — сохранение, а НЕ this.sound.mute: у Phaser сеттер пишет в
  // Web Audio через setValueAtTime, а геттер читает gain.value, который в том же
  // тике ещё старый. Читая обратно, мы сохранили бы предыдущее состояние.
  toggleMute() {
    const save = SaveManager.load();
    const muted = !save.muted;

    save.muted = muted;
    SaveManager.save(save);
    this.sound.mute = muted;

    this.showPopup(muted ? 'звук выкл' : 'звук вкл', CONFIG.colors.textDim);
  }

  /* ---------- горизонтальный ход ---------- */
  driveCart(delta) {
    const c = CONFIG.cart;
    const left = this.keys.left.isDown || this.keys.a.isDown;
    const right = this.keys.right.isDown || this.keys.d.isDown;
    const dir = (left ? -1 : 0) + (right ? 1 : 0);

    // Разгон при удержании: чем дольше держишь одну стрелку, тем быстрее едет тележка.
    // Отпустил или развернулся — счётчик обнуляется, разгон начинается заново.
    // Плата за скорость честная: разогнанная тележка на торможении сильнее бьёт по штабелю
    if (dir === 0 || dir !== this.holdDir) this.holdTime = 0;
    this.holdDir = dir;
    if (dir !== 0) this.holdTime += delta;

    const speed = Phaser.Math.Linear(
      c.speedBase, c.speedMax, Math.min(1, this.holdTime / c.accelTime));

    // Упор в края экрана
    const half = (c.width * this.cart.scale) / 2;
    const minX = half;
    const maxX = CONFIG.screen.width - half;

    let vx = dir * speed;
    if ((this.cart.x <= minX && vx < 0) || (this.cart.x >= maxX && vx > 0)) vx = 0;

    // Рывок — разница скоростей: старт, торможение или разворот
    const dvx = vx - this.cart.vx;
    if (dvx !== 0) this.swayCargo(dvx);
    this.cart.vx = vx;

    if (vx === 0) return;

    const nextX = Phaser.Math.Clamp(this.cart.x + vx * delta / 1000, minX, maxX);
    this.moveCartBy(nextX - this.cart.x, 0);
  }

  // Груз кренится в сторону, обратную рывку: высокий штабель может развалиться.
  // Это и есть ограничитель забега — физика вместо лимита вместимости.
  //
  // Порог swayMinK обязателен. Разгон меняет скорость КАЖДЫЙ кадр в течение
  // accelTime, поэтому dvx ≠ 0 полсотни кадров подряд: без порога штабель получал
  // столько же толчков и столько же случайных подкруток, причём подкрутка не
  // зависела от силы рывка вовсе. Отсюда и брались «5-6 коробок и кузов не удержать»
  swayCargo(dvx) {
    if (this.cargo.length === 0) return;
    const c = CONFIG.cart;
    const k = Math.abs(dvx) / c.speedMax;   // 1 — старт или стоп, 2 — разворот
    if (k < c.swayMinK) return;

    // Нелинейность разводит спокойную езду и рывок: старт с места даёт меньше,
    // разворот на полном ходу — заметно больше. Манёвр обязан рисковать грузом
    const force = Math.pow(k, c.swayPower);
    const push = -Math.sign(dvx) * c.swayImpulse * force;

    const ref = this.refMass();

    this.cargo.forEach(box => {
      const gain = this.topFactor(box) * this.massFactor(box, ref);
      this.matter.body.setVelocity(box.body, {
        x: box.body.velocity.x + push * gain,
        y: box.body.velocity.y
      });
      this.matter.body.setAngularVelocity(box.body, box.body.angularVelocity +
        Phaser.Math.FloatBetween(-c.swaySpin, c.swaySpin) * force * gain);
    });
  }

  // Опорная масса — средняя коробка на текущей рельсе: импульсы в CONFIG заданы
  // для неё. Масштаб рельсы входит в квадрате, иначе на дальней рельсе всё было
  // бы легче и любой толчок сильнее
  refMass() {
    const p = CONFIG.physics;
    const spec = CONFIG.boxes[p.massRefSize];
    const s = this.cart.scale;
    return spec.size * spec.size * s * s * p.boxDensity * spec.densityFactor;
  }

  // Лёгкую коробку сносит сильнее, тяжёлую качает. massInfluence — рубильник:
  // 0 возвращает прежнее поведение, 1 даёт честное dv = J / m
  massFactor(box, ref) {
    const p = CONFIG.physics;
    return Phaser.Math.Clamp(
      Math.pow(ref / box.body.mass, p.massInfluence), p.massFactorMin, p.massFactorMax);
  }

  // Чем выше коробка лежит в кузове, тем сильнее её сносит: низ прижат весом
  // штабеля, верх держится одним трением. Именно поэтому резкий манёвр срывает
  // верхушку, а не разваливает груз целиком — и поэтому высокий штабель рискован
  topFactor(box) {
    const height = Math.max(0, this.cart.y - box.y);
    return 1 + CONFIG.cart.swayTopFactor * height / (100 * this.cart.scale);
  }

  // Двигает тележку и весь груз на одну и ту же дельту
  moveCartBy(dx, dy) {
    if (dx === 0 && dy === 0) return;

    this.cart.x += dx;
    this.cart.y += dy;

    this.matter.body.translate(this.cartBody, { x: dx, y: dy });
    this.cargo.forEach(box => this.matter.body.translate(box.body, { x: dx, y: dy }));
  }

  /* ---------- смена рельсы ---------- */
  switchRail(direction) {
    if (this.switching) return;

    const next = Phaser.Math.Clamp(this.cart.rail + direction, 0, CONFIG.rails.length - 1);
    if (next === this.cart.rail) return;

    const ratio = CONFIG.rails[next].scale / this.cart.scale;
    this.cart.rail = next;
    this.cart.scale = CONFIG.rails[next].scale;
    this.switching = true;

    // Груз получает толчок: резкий манёвр всегда рискует штабелем.
    // Мягкая подвеска из магазина этот толчок гасит
    const impulse = this.upgrades.railImpulse;
    this.cargo.forEach(box => {
      this.matter.body.setVelocity(box.body, {
        x: Phaser.Math.FloatBetween(-impulse, impulse),
        y: box.body.velocity.y - impulse * 0.4
      });
      this.matter.body.setAngularVelocity(box.body, Phaser.Math.FloatBetween(-0.08, 0.08));
    });

    // Груз меняет масштаб вместе с тележкой. Равномерное масштабирование
    // относительно центра сохраняет взаимное расположение — штабель не слипается
    this.cargo.forEach(box => {
      box.setScale(this.cart.scale);
      this.matter.body.setPosition(box.body, {
        x: this.cart.x + (box.x - this.cart.x) * ratio,
        y: this.cart.y + (box.y - this.cart.y) * ratio
      });
      box.setDepth(CONFIG.rails[next].depthBox);
      this.applyFilter(box.body, CAT.cart[next], cartMask(next));
    });

    this.buildCartBody();

    // Тележка едет твином, груз переносится тем же смещением по Y
    const state = { y: this.cart.y };
    const target = this.railBedY(next);

    this.tweens.add({
      targets: state,
      y: target,
      duration: CONFIG.cart.switchDuration,
      ease: 'Quad.easeOut',
      onUpdate: () => this.moveCartBy(0, state.y - this.cart.y),
      onComplete: () => { this.switching = false; }
    });
  }

  /* ---------- спавн падающих объектов ---------- */

  // Что прилетит следующим. С 30-й секунды часть спавнов занимают бомбы:
  // первые полминуты игрок осваивается с одним только потоком коробок
  spawnNext() {
    const b = CONFIG.bombs;
    if (this.run.elapsed >= b.afterMs && Math.random() < b.chance) {
      this.spawnBomb();
      return;
    }
    this.spawnBox();
  }

  // Рельса выбирается 50/50 для всего, что падает
  randomRail() {
    return Math.random() < 0.5 ? 0 : 1;
  }

  // Общая часть всех падающих объектов: тело, масштаб рельсы, фильтр столкновений,
  // отсутствие гравитации в полёте и постоянная скорость.
  // missPenalty по умолчанию 0 — пропустить бомбу или бустер ничего не стоит
  spawnFaller(texture, sizePx, railIndex, data) {
    const rail = CONFIG.rails[railIndex];

    // Объект может появиться в любой точке по ширине — тележка его догоняет
    const margin = sizePx * rail.scale / 2 + 8;
    const x = Phaser.Math.Between(margin, CONFIG.screen.width - margin);

    const p = CONFIG.physics;
    const obj = this.matter.add.image(x, -sizePx, texture, null, {
      friction: p.boxFriction,
      frictionStatic: p.boxFrictionStatic,
      frictionAir: p.boxFrictionAir,
      restitution: p.boxRestitution,
      slop: p.contactSlop,
      density: p.boxDensity * (data.densityFactor || 1)
    });

    // setScale у Matter-объекта Phaser масштабирует и картинку, и тело
    obj.setScale(rail.scale);
    obj.setDepth(rail.depthBox);
    this.applyFilter(obj.body, CAT.fall[railIndex], fallMask(railIndex));

    obj.boxData = Object.assign(
      { kind: 'box', rail: railIndex, state: 'falling', missPenalty: 0 }, data);

    // В полёте гравитации нет: скорость держится ровно такой, как в спеке,
    // и переназначается каждый кадр (иначе frictionAir погасит её на лету)
    obj.setIgnoreGravity(true);
    obj.setVelocity(0, this.run.fallSpeed / 60);

    this.fallingBoxes.push(obj);
    return obj;
  }

  spawnBox() {
    const sizeName = this.pickSize();
    const spec = CONFIG.boxes[sizeName];

    // Сначала выбирается рельса, а цвет жёстко следует из неё:
    // синие падают только на заднюю, жёлтые только на переднюю
    const railIndex = this.randomRail();
    const rail = CONFIG.rails[railIndex];

    this.spawnFaller(`box-${sizeName}-${rail.color}`, spec.size, railIndex, {
      kind: 'box',
      sizeName,
      densityFactor: spec.densityFactor,
      color: rail.color,
      value: spec.value,
      penalty: spec.penalty,
      missPenalty: spec.missPenalty
    });
  }

  // Бомба летит на случайную рельсу наравне с коробками: уехать на другую рельсу —
  // законный способ увернуться, ради этого рельсы и разведены категориями Matter
  spawnBomb() {
    this.spawnFaller('bomb', CONFIG.bombs.size, this.randomRail(), { kind: 'bomb' });
  }

  spawnBooster() {
    if (this.over) return;
    this.spawnFaller('booster', CONFIG.booster.size, this.randomRail(), { kind: 'booster' });
  }

  // Выбор размера по весам из CONFIG
  pickSize() {
    const entries = Object.entries(CONFIG.boxes);
    const total = entries.reduce((sum, [, spec]) => sum + spec.weight, 0);
    let roll = Math.random() * total;
    for (const [name, spec] of entries) {
      roll -= spec.weight;
      if (roll <= 0) return name;
    }
    return entries[0][0];
  }

  /* ---------- ловля ---------- */
  onCollisionStart(event) {
    event.pairs.forEach(pair => {
      const box = this.resolveFallingBox(pair.bodyA) || this.resolveFallingBox(pair.bodyB);
      if (!box) return;

      const other = this.resolveFallingBox(pair.bodyA) ? pair.bodyB : pair.bodyA;

      // Объект ловится и когда лёг на тележку, и когда лёг на уже накопленный
      // груз — иначе верхние коробки продавливали бы штабель
      if (this.isCartPart(other) || this.isCargoBody(other)) {
        this.catchFaller(box);
      }
    });
  }

  // Тело принадлежит тележке, если это она сама или одна из её частей
  isCartPart(body) {
    return body === this.cartBody || body.parent === this.cartBody;
  }

  isCargoBody(body) {
    const go = body.gameObject;
    return !!(go && go.boxData && go.boxData.state === 'cargo');
  }

  resolveFallingBox(body) {
    const go = body.gameObject;
    if (go && go.boxData && go.boxData.state === 'falling') return go;
    return null;
  }

  // Что делает пойманное, зависит от вида: коробка ложится в кузов, бомба рвёт
  // штабель, бустер возвращает XP
  catchFaller(obj) {
    if (obj.boxData.kind === 'bomb') return this.explodeBomb(obj);
    if (obj.boxData.kind === 'booster') return this.collectBooster(obj);
    this.acceptBox(obj);
  }

  // Убрать пойманный объект из воздуха, не делая его грузом
  consumeFaller(obj, state) {
    obj.boxData.state = state;
    this.fallingBoxes = this.fallingBoxes.filter(item => item !== obj);
    obj.destroy();
  }

  // Бомба: −100 XP плюс разлетевшийся штабель. Основное наказание — второе,
  // поэтому импульс заметно сильнее, чем при смене рельсы (GAME_SPEC.md, 5.6)
  explodeBomb(bomb) {
    const b = CONFIG.bombs;
    const x = bomb.x;
    const y = bomb.y;

    this.consumeFaller(bomb, 'exploded');

    this.blastCargo(x, y);

    // Взрыв — тот же error.ogg, но сильно ниже и оттого длиннее и глуше.
    // Отдельного сэмпла в assets/audio/ пока нет
    this.playErrorSound(CONFIG.audio.blastDetune);
    this.cameras.main.shake(b.shakeMs, 0.012);
    this.burstParticles(b.blastParticles, CONFIG.colors.danger, x, y);
    this.xpFlashUntil = this.time.now + CONFIG.hud.flashDuration;
    this.showPopup(`−${b.penalty} XP`, hex(CONFIG.colors.danger));
    this.spendXp(b.penalty);
  }

  // Бустер: +150 XP, но не выше стартового максимума. Показываем то, что реально
  // добавилось: на почти полном запасе это меньше номинала
  collectBooster(booster) {
    this.consumeFaller(booster, 'collected');

    const before = this.run.xp;
    this.run.xp = Math.min(this.run.maxXp, this.run.xp + CONFIG.booster.amount);

    // На полном запасе бустер не даёт ничего, и «+0 XP» выглядело бы как баг
    const gained = this.run.xp - before;
    playSfx(this, 'deliver', { detune: CONFIG.audio.boosterDetune });
    this.showBoosterPopup(gained > 0 ? `+${gained} XP` : 'XP полон');
  }

  // Секций и «чужого цвета» больше нет: коробка своей рельсы всегда принимается
  // и остаётся в кузове физическим телом. Жёлтая просто ложится поверх синей.
  acceptBox(box) {
    box.boxData.state = 'cargo';
    box.setIgnoreGravity(false);
    this.applyFilter(box.body, CAT.cart[this.cart.rail], cartMask(this.cart.rail));

    // За забег скорость падения растёт втрое, а энергия удара по штабелю — в семь
    // раз, ровно к тому моменту, когда штабель высокий. Режем только позднюю
    // эскалацию: до 300 px/с коробка садится ровно так же, как раньше
    const cap = CONFIG.physics.catchMaxSpeed;
    if (box.body.velocity.y > cap) {
      this.matter.body.setVelocity(box.body, { x: box.body.velocity.x, y: cap });
    }

    this.fallingBoxes = this.fallingBoxes.filter(b => b !== box);
    this.cargo.push(box);

    // Пачка коробок, легшая одновременно, не должна давать пачку «туков»
    if (this.time.now - this.lastCatchSound >= CONFIG.audio.catchCooldown) {
      this.lastCatchSound = this.time.now;
      this.playCatchSound();
    }
  }

  // Тон «тука» растёт с каждой коробкой в кузове и сам сбрасывается после сдачи:
  // серия ловель звучит восходящей фразой, а не десятком одинаковых ударов подряд.
  // Сбрасывать вручную нечего — высота считается прямо из размера штабеля
  playCatchSound() {
    const a = CONFIG.audio;
    const step = Math.min(this.cargo.length - 1, a.catchSteps);

    playSfx(this, 'catch', {
      volume: a.catchVolume,
      detune: step * a.catchStep + Phaser.Math.Between(-a.catchJitter, a.catchJitter)
    });
  }

  // Радиальный разлёт от точки взрыва. Три множителя, у каждого свой смысл:
  // расстояние (дальняя коробка почти не сдвинется), масса (лёгкую сносит, тяжёлую
  // качает) и постоянная добавка вверх. Числа коробок здесь нет намеренно: сколько
  // улетит за борт, решает checkCargoOverboard в следующих кадрах
  blastCargo(bx, by) {
    const b = CONFIG.bombs;
    const ref = this.refMass();
    const radius = b.blastRadius * this.cart.scale;   // радиус — длина, масштаб обязателен

    this.cargo.forEach(box => {
      const dx = box.x - bx;
      const dy = box.y - by;
      const dist = Math.hypot(dx, dy);
      if (dist > radius) return;                      // за радиусом коробка остаётся на месте

      // Затухание линейное с полом. Обратный квадрат не даёт границы вовсе, и
      // «сколько улетит» перестало бы зависеть от того, где поймана бомба
      const falloff = b.blastMin + (1 - b.blastMin) * (1 - dist / radius);

      // Коробка ровно в эпицентре направления не имеет — её просто подбрасывает
      let nx = dist > 1 ? dx / dist : Phaser.Math.FloatBetween(-0.5, 0.5);
      let ny = dist > 1 ? dy / dist : 0;

      ny = Math.min(ny - b.blastUp, -b.blastMinUp);   // вниз — никогда
      const len = Math.hypot(nx, ny) || 1;
      nx /= len;
      ny /= len;

      const speed = b.blastImpulse * falloff * this.massFactor(box, ref);

      this.matter.body.setVelocity(box.body, { x: nx * speed, y: ny * speed });
      this.matter.body.setAngularVelocity(box.body,
        Phaser.Math.FloatBetween(-b.blastSpin, b.blastSpin) * falloff);
    });
  }

  /* ---------- сдача груза ---------- */

  // Цена сдачи: сумма ценностей × количество (GAME_SPEC.md, 5.4).
  // Один метод на HUD и на начисление, чтобы показанная цифра не разошлась с реальной
  cargoValue() {
    const count = this.cargo.length;
    if (count === 0) return 0;
    return this.cargo.reduce((sum, box) => sum + box.boxData.value, 0) * count;
  }

  // Цвет большинства коробок в кузове: им красятся и ярлык цены, и частицы сдачи —
  // сразу видно, что именно уехало
  cargoTint() {
    const blues = this.cargo.filter(b => b.boxData.color === 'blue').length;
    return blues * 2 > this.cargo.length ? CONFIG.colors.boxBlue : CONFIG.colors.boxYellow;
  }

  unloadCargo() {
    if (this.cargo.length === 0) return;   // пустой кузов не наказывается

    const gained = this.cargoValue();
    const count = this.cargo.length;
    const tint = this.cargoTint();

    this.run.score += gained;
    this.cargo.forEach(box => box.destroy());
    this.cargo = [];

    playSfx(this, 'deliver');
    this.burstParticles(count, tint);
    this.showPopup(`+${gained}`, hex(tint));
  }

  // Одноразовый выброс частиц из кузова: эмиттер сам себя убирает,
  // иначе за забег их накопились бы сотни
  burstParticles(count, tint, x, y) {
    const p = CONFIG.particles;
    const amount = Math.min(p.max, count * p.perBox);

    // По умолчанию бьёт из кузова (сдача груза); взрыв бомбы задаёт свою точку
    const px = x === undefined ? this.cart.x : x;
    const py = y === undefined ? this.cart.y - 10 : y;

    const emitter = this.add.particles(px, py, 'particle', {
      speed: { min: p.speed * 0.35, max: p.speed },
      angle: { min: 200, max: 340 },
      lifespan: p.lifespan,
      gravityY: 420,
      scale: { start: this.cart.scale, end: 0 },
      tint,
      emitting: false
    });
    emitter.setDepth(this.rail().depthBox + 1);
    emitter.explode(amount);

    this.time.delayedCall(p.lifespan + 200, () => emitter.destroy());
  }

  /* ---------- XP и конец забега ---------- */

  // Две траты XP: груз за бортом и промах. Общая часть — снять и проверить ноль
  spendXp(amount) {
    this.run.xp = Math.max(0, this.run.xp - amount);
    if (this.run.xp === 0) this.endRun();
  }

  // Груз вывалился за борт — ошибка игрока, и она заявляет о себе громко
  penalizeDrop(amount) {
    this.flashError();
    this.playErrorSound();
    // Вспышка полосы — флагом времени, а не твином: отрисовка полосы читает флаг
    this.xpFlashUntil = this.time.now + CONFIG.hud.flashDuration;
    this.showPopup(`−${amount} XP`, hex(CONFIG.colors.danger));
    this.spendXp(amount);
  }

  // Промах — тихий штраф (ADR-0003). Промахов бывает 20+ в минуту на старте и до 85
  // на потолке разгона: тряска камеры и звук ошибки на каждом сделали бы игру
  // неиграбельной. Остаётся только мелкое число в точке падения
  penalizeMiss(amount, x, y) {
    this.showMissLabel(x, y, `−${amount}`);
    this.spendXp(amount);
  }

  endRun() {
    if (this.over) return;
    this.over = true;

    playSfx(this, 'gameover');
    this.spawnTimer.remove();
    this.boosterTimer.remove();
    this.matter.world.off('collisionstart', this.onCollisionStart, this);

    // Итог забега записывается здесь, а не на экране Game Over: на тот экран можно
    // вернуться из магазина, и его create() начислил бы валюту второй раз
    const save = SaveManager.load();
    const isRecord = this.run.score > save.bestScore;
    if (isRecord) save.bestScore = this.run.score;
    save.currency += this.run.score;
    SaveManager.save(save);

    // Пауза перед экраном: игрок должен успеть увидеть, что именно его добило
    this.time.delayedCall(800, () => {
      this.scene.start('GameOverScene', { score: this.run.score, isRecord });
    });
  }

  /* ---------- обратная связь ---------- */

  // Звук ошибки ограничен по частоте так же, как звук ловли: взрыв бомбы
  // выбрасывает из кузова сразу несколько коробок, и каждая просила бы свой звук.
  // detune задаёт взрыв — он звучит тем же сэмплом, но сильно ниже
  playErrorSound(detune) {
    if (this.time.now - this.lastErrorSound < CONFIG.audio.errorCooldown) return;
    this.lastErrorSound = this.time.now;
    playSfx(this, 'error', { detune: detune || 0 });
  }

  flashError() {
    this.cameras.main.shake(120, 0.006);
  }

  // Бустер отчитывается в правом верхнем углу (GAME_SPEC.md, раздел 11):
  // над тележкой ему тесно, там уже стоит цена сдачи
  showBoosterPopup(text) {
    const label = this.add.text(CONFIG.screen.width - 20, 20, text,
      textStyle(22, hex(CONFIG.colors.booster), true)).setOrigin(1, 0).setDepth(20);

    this.tweens.add({
      targets: label,
      y: label.y - 26,
      alpha: 0,
      duration: CONFIG.booster.popupDuration,
      ease: 'Quad.easeOut',
      onComplete: () => label.destroy()
    });
  }

  // Мелкое приглушённое число в точке промаха: видно, что XP ушёл, но глаз не дёргается
  showMissLabel(x, y, text) {
    const label = this.add.text(x, y, text, textStyle(15, CONFIG.colors.textDim))
      .setOrigin(0.5).setAlpha(0.85).setDepth(19);

    this.tweens.add({
      targets: label,
      y: y - 22,
      alpha: 0,
      duration: 500,
      ease: 'Quad.easeOut',
      onComplete: () => label.destroy()
    });
  }

  // Всплывающее число над тележкой: сдача груза и потеря груза
  showPopup(text, color) {
    // Выше ярлыка цены, иначе «+400» при сдаче ложится ровно на него
    const y = this.cargoPrice.visible
      ? Math.min(this.cart.y - 60, this.cargoPrice.y - 30)
      : this.cart.y - 60;

    const label = this.add.text(this.cart.x, y, text,
      textStyle(22, color, true)).setOrigin(0.5).setDepth(20);

    this.tweens.add({
      targets: label,
      y: label.y - 40,
      alpha: 0,
      duration: 700,
      ease: 'Quad.easeOut',
      onComplete: () => label.destroy()
    });
  }

  /* ---------- цикл ---------- */
  update(time, delta) {
    if (this.over) return;   // забег кончился, ждём экран Game Over

    this.run.elapsed += delta;

    this.driveCart(delta);
    this.rampDifficulty();
    this.holdFallSpeed();
    this.checkMissedBoxes();
    this.checkCargoOverboard();
    this.drawShadows();
    this.drawCart();
    this.updateHud();
  }

  // Плавный рост темпа без конца (GAME_SPEC.md, раздел 5.3)
  rampDifficulty() {
    if (this.run.elapsed - this.run.lastRamp < CONFIG.fall.rampEvery) return;
    this.run.lastRamp = this.run.elapsed;

    this.run.fallSpeed = Math.min(
      CONFIG.fall.speedMax, this.run.fallSpeed * CONFIG.fall.speedStep);
    this.run.spawnInterval = Math.max(
      CONFIG.fall.intervalMin, this.run.spawnInterval * CONFIG.fall.intervalStep);

    this.spawnTimer.reset({
      delay: this.run.spawnInterval,
      loop: true,
      callback: () => this.spawnNext()
    });
  }

  // Держит скорость падения ровно такой, как в CONFIG: сопротивление воздуха
  // иначе тормозит коробки в полёте
  holdFallSpeed() {
    const v = this.run.fallSpeed / 60;
    this.fallingBoxes.forEach(box => box.setVelocity(0, v));
  }

  // Коробка, улетевшая ниже СВОЕЙ рельсы, — промах.
  // Порог у каждой рельсы свой, иначе задняя коробка падала бы до передней.
  // Промах стоит XP (ADR-0003), но штраф мелкий и тихий
  checkMissedBoxes() {
    for (let i = this.fallingBoxes.length - 1; i >= 0; i--) {
      const box = this.fallingBoxes[i];
      const limit = this.railLineY(box.boxData.rail) + CONFIG.bounds.missBelowRail;
      if (box.y > limit) {
        // Всё нужное читаем до destroy: после него у объекта нет ни координат, ни данных
        const penalty = box.boxData.missPenalty;
        const x = box.x;
        const y = box.y;

        box.boxData.state = 'missed';
        box.destroy();
        this.fallingBoxes.splice(i, 1);
        // Пропущенные бомба и бустер ничего не стоят: у них missPenalty = 0
        if (penalty > 0) this.penalizeMiss(penalty, x, y);
      }
    }
  }

  // Груз, вывалившийся за борт, — потеря
  checkCargoOverboard() {
    const s = this.cart.scale;
    const limitX = (CONFIG.cart.width / 2 + CONFIG.bounds.cargoDropX) * s;
    const limitY = CONFIG.bounds.cargoDropY * s;

    for (let i = this.cargo.length - 1; i >= 0; i--) {
      const box = this.cargo[i];
      const outX = Math.abs(box.x - this.cart.x) > limitX;
      const outY = box.y > this.cart.y + limitY;

      if (outX || outY) {
        const penalty = box.boxData.penalty;   // читаем до destroy
        box.boxData.state = 'missed';
        this.cargo.splice(i, 1);
        box.destroy();
        this.penalizeDrop(penalty);
      }
    }
  }

  /* ---------- HUD ---------- */
  createHud() {
    const { width } = CONFIG.screen;
    const h = CONFIG.hud;

    // Полоса XP — верх слева. Перерисовывается каждый кадр по позиции, как тележка
    this.xpBar = this.add.graphics().setDepth(20);
    this.xpText = this.add.text(24 + h.xpBarWidth, 14, '',
      textStyle(15, CONFIG.colors.textDim)).setDepth(20);

    // Цена сдачи висит над кузовом, а не в углу HUD: решение «сдать или взять ещё»
    // принимается глазами на тележке, туда же должна смотреть и цифра.
    // Количество коробок не пишем — оно видно и так, коробки лежат физически
    this.cargoPrice = this.add.text(0, 0, '', textStyle(24, CONFIG.colors.text, true))
      .setOrigin(0.5, 1).setDepth(20).setVisible(false);

    // Счёт — главная цифра забега, крупно по центру. Коробки проходят за ним
    this.scoreText = this.add.text(width / 2, 10, '0',
      textStyle(36, CONFIG.colors.text, true)).setOrigin(0.5, 0).setDepth(20);
    this.add.text(width / 2, 54, `Рекорд: ${this.bestScore}`,
      textStyle(15, CONFIG.colors.textDim)).setOrigin(0.5, 0).setDepth(20);

    this.createHint();
  }

  // Подсказка клавиш висит первые 10 секунд и гаснет. Вернуть её можно клавишей H:
  // после того как она погасла, подсмотреть управление по ходу забега было негде
  createHint() {
    // Ставим на полосу пола под передней рельсой: в середине экрана подсказка
    // оказывалась ровно на пути падающих коробок и резала их пополам
    this.hint = this.add.text(CONFIG.screen.width / 2, CONFIG.screen.height - 24,
      '← → — ехать  ·  ↑ ↓ — рельса  ·  Пробел — сдать  ·  Esc — пауза  ·  M — звук  ·  H — эта строка',
      textStyle(16, CONFIG.colors.textDim)).setOrigin(0.5).setDepth(20);

    this.showHint();
  }

  // Текст живёт весь забег и только меняет прозрачность: пересоздавать его на каждое
  // нажатие H значило бы плодить объекты и таймеры, которые никто не убирает
  showHint() {
    if (this.hintFade) this.hintFade.stop();
    if (this.hintTimer) this.hintTimer.remove();

    this.hint.setAlpha(1);
    this.hintTimer = this.time.delayedCall(CONFIG.hud.hintDuration, () => {
      this.hintFade = this.tweens.add({ targets: this.hint, alpha: 0, duration: 600 });
    });
  }

  // Ярлык встаёт над ВЕРХНЕЙ коробкой штабеля, а не на фиксированной высоте:
  // иначе высокий штабель залезал бы прямо на цифру
  updateCargoPrice() {
    if (this.cargo.length === 0) {
      this.cargoPrice.setVisible(false);
      return;
    }

    const top = this.cargo.reduce(
      (min, box) => Math.min(min, box.y - box.displayHeight / 2), this.cart.y);

    this.cargoPrice
      .setVisible(true)
      .setPosition(this.cart.x, top - 10)
      .setText(String(this.cargoValue()))
      .setColor(hex(this.cargoTint()));
  }

  xpRatio() {
    return this.run.maxXp === 0 ? 0 : this.run.xp / this.run.maxXp;
  }

  // Цвет полосы плавно едет от зелёного (полный XP) к красному (пустой).
  // Порога и пульсации больше нет: мигающая полоса раздражала на длинной дистанции,
  // а плавный цвет читается сам по себе, без твинов и без флага состояния
  xpBarColor() {
    const t = this.xpRatio();
    const from = CONFIG.colors.danger;
    const to = CONFIG.colors.booster;
    const channel = shift => Math.round(
      ((from >> shift) & 0xff) + (((to >> shift) & 0xff) - ((from >> shift) & 0xff)) * t);

    return (channel(16) << 16) | (channel(8) << 8) | channel(0);
  }

  drawXpBar() {
    const h = CONFIG.hud;
    const g = this.xpBar;

    g.clear();

    // Подложка
    g.fillStyle(CONFIG.colors.cartDark, 1);
    g.fillRect(16, 14, h.xpBarWidth, h.xpBarHeight);

    // Заливка по остатку XP; в момент потери груза полоса коротко вспыхивает белым
    const flashing = this.time.now < this.xpFlashUntil;
    g.fillStyle(flashing ? 0xffffff : this.xpBarColor(), 1);
    g.fillRect(16, 14, h.xpBarWidth * this.xpRatio(), h.xpBarHeight);

    // Обводка отделяет полосу от фона
    g.lineStyle(2, 0x000000, 0.35);
    g.strokeRect(16, 14, h.xpBarWidth, h.xpBarHeight);
  }

  updateHud() {
    this.drawXpBar();
    this.xpText.setText(`${this.run.xp} / ${this.run.maxXp} XP`);
    this.scoreText.setText(String(this.run.score));

    this.updateCargoPrice();
  }

  pauseGame() {
    // Пауза во время задержки перед Game Over заморозила бы отложенный переход
    if (this.over) return;
    this.scene.pause();
    this.scene.launch('PauseScene');
  }
}

/* ============================================================================
   PauseScene — поверх игры, физика при этом стоит
   ========================================================================= */
class PauseScene extends Phaser.Scene {
  constructor() { super('PauseScene'); }

  create() {
    const { width, height } = CONFIG.screen;

    this.add.rectangle(0, 0, width, height, 0x000000, 0.65).setOrigin(0).setDepth(0);

    this.add.text(width / 2, 80, 'ПАУЗА', textStyle(54, '#ffffff', true))
      .setOrigin(0.5);

    // Список клавиш таблицей, а не строкой в 16 px: на паузе он читается не мельком,
    // и это единственное место, где управление можно спокойно разобрать
    drawKeyHints(this, width / 2, 165);

    makeButton(this, width / 2, 420, 'ПРОДОЛЖИТЬ', () => this.resumeGame(),
      { width: 260, height: 58, size: 24 });
    makeButton(this, width / 2, 492, 'В МЕНЮ', () => {
      this.scene.stop('GameScene');
      this.scene.stop();
      this.scene.start('MenuScene');
    }, { width: 260, height: 58, size: 24 });

    this.input.keyboard.on('keydown-ESC', () => this.resumeGame());
    this.input.keyboard.on('keydown-P', () => this.resumeGame());
  }

  resumeGame() {
    this.scene.stop();
    this.scene.resume('GameScene');
  }
}

/* ============================================================================
   GameOverScene — каркас, включится на этапе 2 вместе с XP
   ========================================================================= */
class GameOverScene extends Phaser.Scene {
  constructor() { super('GameOverScene'); }

  // Экран только показывает итог: рекорд и валюта уже записаны в endRun(),
  // потому что сюда можно вернуться из магазина
  init(data) {
    this.finalScore = data.score || 0;
    this.isRecord = !!data.isRecord;
  }

  create() {
    const { width } = CONFIG.screen;
    this.cameras.main.setBackgroundColor(CONFIG.colors.bg);

    const save = SaveManager.load();
    const isRecord = this.isRecord;

    this.add.text(width / 2, 130, 'ЗАБЕГ ОКОНЧЕН',
      textStyle(52, CONFIG.colors.text, true)).setOrigin(0.5);

    this.add.text(width / 2, 212, `Счёт: ${this.finalScore}`,
      textStyle(32, CONFIG.colors.text)).setOrigin(0.5);

    this.add.text(width / 2, 256, isRecord ? 'Новый рекорд!' : `Рекорд: ${save.bestScore}`,
      textStyle(22, isRecord ? hex(CONFIG.colors.booster) : CONFIG.colors.textDim)).setOrigin(0.5);

    this.add.text(width / 2, 318, `Заработано: +${this.finalScore}`,
      textStyle(24, hex(CONFIG.colors.boxYellow), true)).setOrigin(0.5);
    this.add.text(width / 2, 350, `Всего монет: ${save.currency}`,
      textStyle(18, CONFIG.colors.textDim)).setOrigin(0.5);

    const opts = { width: 240, height: 58, size: 24 };
    makeButton(this, width / 2 - 140, 424, 'ЕЩЁ РАЗ',
      () => this.scene.start('GameScene'), opts);
    makeButton(this, width / 2 + 140, 424, 'В МЕНЮ',
      () => this.scene.start('MenuScene'), opts);

    // Вход в магазин прямо отсюда: игрок только что получил валюту и готов её тратить
    makeButton(this, width / 2, 496, 'МАГАЗИН', () => this.scene.start('ShopScene', {
      from: 'GameOverScene',
      returnData: { score: this.finalScore, isRecord: this.isRecord }
    }), opts);
  }
}

/* ============================================================================
   ShopScene — магазин улучшений (GAME_SPEC.md, 5.8)
   ========================================================================= */
class ShopScene extends Phaser.Scene {
  constructor() { super('ShopScene'); }

  // Магазин открывается и из меню, и с экрана Game Over; НАЗАД возвращает туда же.
  // returnData нужен экрану Game Over: он показывает счёт забега, а тот живёт
  // только в параметрах сцены
  init(data) {
    this.from = (data && data.from) || 'MenuScene';
    this.returnData = (data && data.returnData) || {};
    this.confirmReset = false;
  }

  create() {
    const { width, height } = CONFIG.screen;
    this.cameras.main.setBackgroundColor(CONFIG.colors.bg);

    this.save = SaveManager.load();

    this.add.text(width / 2, 52, 'МАГАЗИН',
      textStyle(44, CONFIG.colors.text, true)).setOrigin(0.5);

    this.add.text(width - 24, 30, `Монет: ${this.save.currency}`,
      textStyle(22, hex(CONFIG.colors.boxYellow), true)).setOrigin(1, 0.5);

    // Три линейки улучшений одной и той же строкой
    CONFIG.shop.order.forEach((key, index) => this.drawRow(key, 140 + index * 112));

    makeButton(this, width / 2, 500, 'НАЗАД', () => this.goBack(),
      { width: 240, height: 54, size: 24 });

    this.createResetButton(width / 2, height - 40);

    this.input.keyboard.on('keydown-ESC', () => this.goBack());
  }

  goBack() {
    this.scene.start(this.from, this.returnData);
  }

  // Строка улучшения: название и эффект слева, уровни и покупка справа
  drawRow(key, y) {
    const spec = CONFIG.shop[key];
    const level = this.save.upgrades[key];
    const maxLevel = spec.prices.length;
    const maxed = level >= maxLevel;
    const price = maxed ? 0 : spec.prices[level];
    const affordable = !maxed && this.save.currency >= price;

    // Подложка строки — иначе три блока сливаются в сплошной текст
    const g = this.add.graphics();
    g.fillStyle(CONFIG.colors.bed, 1);
    g.fillRoundedRect(40, y - 40, CONFIG.screen.width - 80, 88, 8);

    this.add.text(64, y - 22, spec.title, textStyle(22, CONFIG.colors.text, true));
    this.add.text(64, y + 8, spec.effect, textStyle(15, CONFIG.colors.textDim));

    this.drawLevelPips(64, y + 34, level, maxLevel);

    // Цена и кнопка. Не хватает монет — цена краснеет, кнопка гаснет
    const priceColor = affordable ? hex(CONFIG.colors.boxYellow) : hex(CONFIG.colors.danger);
    this.add.text(CONFIG.screen.width - 190, y + 2,
      maxed ? 'куплено полностью' : `${price} монет`,
      textStyle(17, maxed ? CONFIG.colors.textDim : priceColor, !maxed)).setOrigin(1, 0.5);

    makeButton(this, CONFIG.screen.width - 110, y + 2, maxed ? 'МАКС' : 'КУПИТЬ',
      () => this.buy(key), { width: 130, height: 44, size: 18, disabled: !affordable });
  }

  // Уровни кружками: закрашенный — купленный. Числом «2/3» это читается хуже
  drawLevelPips(x, y, level, maxLevel) {
    const g = this.add.graphics();
    for (let i = 0; i < maxLevel; i++) {
      const cx = x + 9 + i * 24;
      if (i < level) {
        g.fillStyle(CONFIG.colors.booster, 1);
        g.fillCircle(cx, y, 7);
      } else {
        g.lineStyle(2, CONFIG.colors.rail, 1);
        g.strokeCircle(cx, y, 7);
      }
    }
  }

  buy(key) {
    const spec = CONFIG.shop[key];
    const level = this.save.upgrades[key];
    if (level >= spec.prices.length) return;

    const price = spec.prices[level];
    if (this.save.currency < price) return;

    this.save.currency -= price;
    this.save.upgrades[key] = level + 1;
    SaveManager.save(this.save);

    playSfx(this, 'deliver');

    // Перерисовываем сцену целиком: это проще и надёжнее, чем точечно обновлять
    // цену, кружки и состояние кнопки в трёх строках
    this.scene.restart({ from: this.from, returnData: this.returnData });
  }

  // Сброс прогресса. Первое нажатие только переспрашивает, через 3 секунды
  // вопрос снимается сам: случайно снести рекорд и все апгрейды нельзя
  createResetButton(x, y) {
    const label = this.add.text(x, y, 'сбросить прогресс',
      textStyle(14, CONFIG.colors.textDim)).setOrigin(0.5)
      .setInteractive({ useHandCursor: true });

    label.on('pointerdown', () => {
      if (!this.confirmReset) {
        this.confirmReset = true;
        label.setText('точно? нажмите ещё раз').setColor(hex(CONFIG.colors.danger));
        this.time.delayedCall(3000, () => {
          if (!this.scene.isActive() || !this.confirmReset) return;
          this.confirmReset = false;
          label.setText('сбросить прогресс').setColor(CONFIG.colors.textDim);
        });
        return;
      }

      // Немой режим — настройка, а не прогресс: он сброс переживает
      SaveManager.save({ ...SaveManager.defaults, muted: this.save.muted });
      this.scene.restart({ from: this.from, returnData: this.returnData });
    });
  }
}

/* ============================================================================
   Запуск
   ========================================================================= */
const gameConfig = {
  type: Phaser.AUTO,
  parent: 'game',
  width: CONFIG.screen.width,
  height: CONFIG.screen.height,
  backgroundColor: CONFIG.colors.bg,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  physics: {
    default: 'matter',
    matter: {
      gravity: { x: 0, y: CONFIG.physics.gravityY },
      positionIterations: CONFIG.physics.positionIterations,
      velocityIterations: CONFIG.physics.velocityIterations,
      debug: CONFIG.debug
    }
  },
  scene: [BootScene, MenuScene, GameScene, PauseScene, GameOverScene, ShopScene]
};

const game = new Phaser.Game(gameConfig);

// Пропорция канваса подобрана под окно на старте; при изменении размера окна
// пересчитываем вписывание. Точная подгонка пропорции — после перезагрузки
window.addEventListener('resize', () => game.scale.refresh());
</script>
