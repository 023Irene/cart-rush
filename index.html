<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cart Rush</title>
<!-- Иконка вкладки инлайном: без неё браузер сам просит /favicon.ico и пишет 404 в консоль -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2333363b'/><rect x='3' y='5' width='10' height='6' fill='%23e8b33a'/><rect x='4' y='12' width='8' height='1' fill='%236b7078'/></svg>">
<style>
  /* Страница только держит канву — вся отрисовка внутри Phaser.
     Никакого флекс-центрирования: канвас центрирует сам Phaser (CENTER_BOTH),
     два центрирования подряд складывались и уводили канвас за край экрана. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #game {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #33363b;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  /* Двойной клик по канвасу не должен выделять ничего вокруг игры */
  html, body, #game, canvas {
    -webkit-user-select: none;
    user-select: none;
  }
  canvas { display: block; }
</style>
</head>
<body>

<div id="game"></div>

<!-- Код игры разложен по модулям в src/ (ADR-0011). Phaser ставится из npm,
     версия закреплена точным номером 4.2.1 — внешних адресов в сборке нет. -->
<script type="module" src="/src/main.js"></script>

</body>
</html>
